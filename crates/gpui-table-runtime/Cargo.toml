[package]
name = "gpui-table-runtime"
description = """
GPUI runtime traits and helpers for gpui-table.
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = [ "jiff" ]
jiff = [ "dep:icu", "dep:jiff", "gpui-table-core/jiff" ]
rust_decimal = [ "dep:rust_decimal", "gpui-table-core/rust_decimal" ]
spacetimedb = [ "dep:spacetimedb-lib", "jiff", "gpui-table-core/spacetimedb" ]

[dependencies]
component-shape = { workspace = true }
gpui-kit = { workspace = true }
gpui-table-core = { default-features = false, workspace = true }
gpui-table-schema = { workspace = true }
icu = { optional = true, workspace = true }
jiff = { optional = true, workspace = true }
rust_decimal = { optional = true, workspace = true }
spacetimedb-lib = { optional = true, workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Timestamp cells use the browser's timezone, not just bundled timezone data.
jiff = { features = [ "js" ], optional = true, workspace = true }

[lints]
workspace = true
