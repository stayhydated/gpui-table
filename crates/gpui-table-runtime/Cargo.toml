[package]
name = "gpui-table-runtime"
description = """
GPUI runtime traits and helpers for gpui-table.
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[features]
chrono = [ "dep:chrono", "jiff" ]
default = [ "chrono" ]
jiff = [ "dep:icu", "dep:jiff" ]
rust_decimal = [ "dep:rust_decimal" ]
spacetimedb = [ "dep:spacetimedb-lib", "chrono" ]

[dependencies]
chrono = { optional = true, workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-table-component = { workspace = true }
gpui-table-core = { workspace = true }
gpui-table-schema = { workspace = true }
icu = { optional = true, workspace = true }
jiff = { optional = true, workspace = true }
rust_decimal = { optional = true, workspace = true }
spacetimedb-lib = { optional = true, workspace = true }

[lints]
workspace = true
