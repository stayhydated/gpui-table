[package]
name = "gpui-table-component"
description = "Built-in GPUI table filters, adapter shapes, reset controls, and status bars"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"
autobins = false

[[bin]]
name = "story"
path = "src/bin/story.rs"
required-features = [ "story" ]

[features]
default = [ "jiff", "rust_decimal" ]
jiff = [
  "dep:icu",
  "dep:jiff",
  "gpui-table-mcp?/jiff",
  "gpui-table-core/jiff",
  "gpui-table-runtime/jiff",
]
mcp = [ "dep:gpui-table-mcp" ]
rust_decimal = [
  "dep:rust_decimal",
  "gpui-table-mcp?/rust_decimal",
  "gpui-table-core/rust_decimal",
  "gpui-table-runtime/rust_decimal",
]
spacetimedb = [
  "jiff",
  "dep:spacetimedb-lib",
  "gpui-table-mcp?/spacetimedb",
  "gpui-table-core/spacetimedb",
  "gpui-table-runtime/spacetimedb",
]
story = [ "jiff", "rust_decimal", "dep:gpui-storybook", "dep:iso-types" ]

[dependencies]
component-shape = { workspace = true }
es-fluent = { workspace = true }
es-fluent-manager-embedded = { workspace = true }
gpui-es-fluent = { features = [ "component" ], workspace = true }
gpui-kit = { workspace = true }
gpui-storybook = { optional = true, workspace = true }
gpui-table-core = { default-features = false, features = [ "fluent" ], workspace = true }
gpui-table-mcp = { default-features = false, optional = true, workspace = true }
gpui-table-runtime = { default-features = false, workspace = true }
gpui-table-schema = { workspace = true }
icu = { optional = true, workspace = true }
iso-types = { optional = true, workspace = true }
jiff = { optional = true, workspace = true }
regex = { workspace = true }
rust_decimal = { optional = true, workspace = true }
spacetimedb-lib = { optional = true, workspace = true }
thiserror = { workspace = true }

[build-dependencies]
es-fluent-build = { workspace = true }

[dev-dependencies]
gpui-kit = { features = [ "test-support" ], workspace = true }

[lints]
workspace = true
