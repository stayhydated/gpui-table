[package]
name = "gpui-table-core"
description = """
Core crate for gpui-table
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[features]
chrono = [ "dep:chrono" ]
default = [ "chrono" ]
fluent = [ "dep:es-fluent", "dep:es-fluent-manager-embedded", "es-fluent/derive" ]
rust_decimal = [ "dep:rust_decimal" ]
spacetimedb = [ "dep:spacetimedb-lib", "chrono" ]

[dependencies]
chrono = { optional = true, workspace = true }
derive_more = { features = [ "full" ], workspace = true }
es-fluent = { optional = true, workspace = true }
es-fluent-manager-embedded = { optional = true, workspace = true }
gpui-table-schema = { workspace = true }
rust_decimal = { optional = true, workspace = true }
spacetimedb-lib = { optional = true, workspace = true }

[build-dependencies]
es-fluent-build = { workspace = true }

[lints]
workspace = true
