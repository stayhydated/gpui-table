[package]
name = "gpui-table"
description = """
The gpui-table crate
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[features]
chrono = [
  "dep:chrono",
  "gpui-table-core/chrono",
  "gpui-table-derive/chrono",
  "gpui-table-mcp?/chrono",
  "gpui-table-runtime/chrono",
]
default = [ "derive", "chrono" ]
derive = [ "dep:gpui-table-derive" ]
fluent = [ "gpui-table-core/fluent", "gpui-table-derive/fluent" ]
inventory = [ "gpui-table-derive/inventory" ]
mcp = [ "dep:gpui-table-mcp", "inventory", "gpui-table-derive?/mcp" ]
rust_decimal = [
  "dep:rust_decimal",
  "gpui-table-core/rust_decimal",
  "gpui-table-derive/rust_decimal",
  "gpui-table-mcp?/rust_decimal",
  "gpui-table-runtime/rust_decimal",
]
spacetimedb = [
  "gpui-table-core/spacetimedb",
  "gpui-table-derive/spacetimedb",
  "gpui-table-mcp?/spacetimedb",
  "gpui-table-runtime/spacetimedb",
]

[dependencies]
chrono = { optional = true, workspace = true }
gpui-table-core = { default-features = false, workspace = true }
gpui-table-derive = { optional = true, workspace = true }
gpui-table-mcp = { default-features = false, optional = true, workspace = true }
gpui-table-runtime = { default-features = false, workspace = true }
gpui-table-schema = { workspace = true }
rust_decimal = { optional = true, workspace = true }
serde = { features = [ "derive" ], workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
gpui-kit = { workspace = true }
gpui-table-component = { features = [ "mcp", "rust_decimal", "spacetimedb" ], workspace = true }
insta = { features = [ "yaml" ], workspace = true }
koruma = { workspace = true }
koruma-collection = { workspace = true }
spacetimedb-lib = { workspace = true }
strum = { features = [ "derive" ], workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true
