[package]
name = "gpui-table-derive"
description = """
Derive crate for gpui-table
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
proc-macro = true

[features]
chrono = [  ]
fluent = [  ]
inventory = [  ]
mcp = [ "inventory" ]
rust_decimal = [  ]
spacetimedb = [  ]

[dependencies]
component-shape = { workspace = true }
component-shape-codegen = { workspace = true }
darling = { workspace = true }
heck = { workspace = true }
koruma-derive-core = { workspace = true }
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { features = [ "full" ], workspace = true }

[lints]
workspace = true
