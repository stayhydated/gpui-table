[workspace]
default-members = [ "examples/some-lib-tables" ]
members = [
  "crates/gpui-table",
  "crates/gpui-table-component",
  "crates/gpui-table-core",
  "crates/gpui-table-derive",
  "crates/gpui-table-mcp",
  "crates/gpui-table-prototyping-core",
  "crates/gpui-table-runtime",
  "crates/gpui-table-schema",
  "examples/mcp-query",
  "examples/prototyping",
  "examples/some-lib",
  "examples/some-lib-tables",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/stayhydated/gpui-table"
rust-version = "1.98"
version = "0.6.0"

[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = "4.6"
component-shape = { git = "https://github.com/stayhydated/component-shape", rev = "21a910f5eabf68a74195915e6dcc88d59d85c061", version = "0.2.0" }
component-shape-codegen = { git = "https://github.com/stayhydated/component-shape", rev = "21a910f5eabf68a74195915e6dcc88d59d85c061", version = "0.2.0" }
component-shape-mcp = { git = "https://github.com/stayhydated/component-shape", rev = "21a910f5eabf68a74195915e6dcc88d59d85c061", version = "0.2.0" }
darling = "0.24"
derive_more = "2.1"
dioxus = { default-features = false, version = "0.7" }
env_logger = "0.11"
es-fluent = { git = "https://github.com/stayhydated/es-fluent", rev = "1b65a06860da8a08282220b92d69ad30ae6664f1", version = "0.18.1" }
es-fluent-build = { git = "https://github.com/stayhydated/es-fluent", rev = "1b65a06860da8a08282220b92d69ad30ae6664f1", version = "0.18.1" }
es-fluent-lang = { git = "https://github.com/stayhydated/es-fluent", rev = "1b65a06860da8a08282220b92d69ad30ae6664f1", version = "0.18.1" }
es-fluent-manager-embedded = { git = "https://github.com/stayhydated/es-fluent", rev = "1b65a06860da8a08282220b92d69ad30ae6664f1", version = "0.18.1" }
fake = "5.1"
gpui = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "0.2.2" }
gpui-component = { git = "https://github.com/stayhydated/gpui-component", rev = "fc7ea7a1a56daa54cfe48b0bcb688493eaff198b" }
gpui-es-fluent = { git = "https://github.com/stayhydated/gpui-es-fluent", rev = "012464ce5c1aa98212b562d585ae509795d517c9", version = "0.1.0" }
gpui-storybook = { git = "https://github.com/stayhydated/gpui-storybook", rev = "c888a85932ffd2fd6cfe8d3361e0636cc7c842fd", version = "0.5.0" }
gpui-table = { path = "crates/gpui-table", version = "0.6.0" }
gpui-table-component = { default-features = false, path = "crates/gpui-table-component", version = "0.6.0" }
gpui-table-core = { default-features = false, path = "crates/gpui-table-core", version = "0.6.0" }
gpui-table-derive = { path = "crates/gpui-table-derive", version = "0.6.0" }
gpui-table-mcp = { default-features = false, path = "crates/gpui-table-mcp", version = "0.6.0" }
gpui-table-prototyping-core = { path = "crates/gpui-table-prototyping-core", version = "0.6.0" }
gpui-table-runtime = { default-features = false, path = "crates/gpui-table-runtime", version = "0.6.0" }
gpui-table-schema = { path = "crates/gpui-table-schema", version = "0.6.0" }
gpui_platform = { branch = "linux-headless-renderer", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
], git = "https://github.com/stayhydated/zed" }
heck = "0.5.0"
icu = "2.2"
insta = "1.48"
inventory = "0.3"
itertools = "0.15"
jiff = "0.2"
koruma = { git = "https://github.com/stayhydated/koruma", rev = "f86973a86d7260a3589e9070ec5e44000eafa61c", version = "0.11.0" }
koruma-collection = { git = "https://github.com/stayhydated/koruma", rev = "f86973a86d7260a3589e9070ec5e44000eafa61c", version = "0.11.0" }
koruma-derive-core = { git = "https://github.com/stayhydated/koruma", rev = "f86973a86d7260a3589e9070ec5e44000eafa61c", version = "0.11.0" }
log = "0.4"
prettyplease = "0.3"
proc-macro-crate = "3.5"
proc-macro2 = "1.0"
quote = "1.0"
regex = "1.13"
reqwest = "0.13"
reqwest_client = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed" }
rmcp = "3.1"
rust_decimal = "1.42"
serde = "1.0"
serde_json = "1.0"
spacetimedb-lib = "2.8"
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "74aec628e81fc4cc04b2f34ef22c63ba95847334" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "74aec628e81fc4cc04b2f34ef22c63ba95847334" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "74aec628e81fc4cc04b2f34ef22c63ba95847334" }
strum = "0.28"
syn = "3.0"
thiserror = "2.0"
tokio = "1.53"
tracing-subscriber = "0.3"
trybuild = "1.0"
unicode-segmentation = "1.13"
urlencoding = "2.1"
uuid = "1.24"
wasm-bindgen = "0.2"
web = { path = "web" }
web-sys = { features = [ "Location", "Window" ], version = "0.3" }

[patch."https://github.com/zed-industries/zed"]
gpui = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "=0.2.2" }
gpui_macros = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "0.1.0" }

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
