[workspace]
default-members = [ "examples/some-lib-tables" ]
members = [
  "crates/gpui-table",
  "crates/gpui-table-component",
  "crates/gpui-table-core",
  "crates/gpui-table-derive",
  "crates/gpui-table-mcp",
  "crates/gpui-table-prototyping-core",
  "crates/gpui-table-runtime",
  "crates/gpui-table-schema",
  "examples/mcp-query",
  "examples/prototyping",
  "examples/some-lib",
  "examples/some-lib-tables",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/stayhydated/gpui-table"
rust-version = "1.96"
version = "0.5.0"

[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"
component-shape = { git = "https://github.com/stayhydated/component-shape" }
component-shape-codegen = { git = "https://github.com/stayhydated/component-shape" }
component-shape-mcp = { git = "https://github.com/stayhydated/component-shape" }
darling = "0.23"
derive_more = "2.1"
env_logger = "0.11"
es-fluent = { git = "https://github.com/stayhydated/es-fluent" }
es-fluent-build = { git = "https://github.com/stayhydated/es-fluent" }
es-fluent-lang = { git = "https://github.com/stayhydated/es-fluent" }
es-fluent-manager-embedded = { git = "https://github.com/stayhydated/es-fluent" }
fake = "5.1"
gpui = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "0.2.2" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-es-fluent = { git = "https://github.com/stayhydated/gpui-es-fluent" }
gpui-storybook = { git = "https://github.com/stayhydated/gpui-storybook", rev = "450c3b13d328c94a89a768a59c7a5fbd62ecc60f" }
gpui-table = { path = "crates/gpui-table", version = "0.5.0" }
gpui-table-component = { default-features = false, path = "crates/gpui-table-component", version = "0.5.0" }
gpui-table-core = { default-features = false, path = "crates/gpui-table-core", version = "0.5.0" }
gpui-table-derive = { path = "crates/gpui-table-derive", version = "0.5.0" }
gpui-table-mcp = { default-features = false, path = "crates/gpui-table-mcp", version = "0.5.0" }
gpui-table-prototyping-core = { path = "crates/gpui-table-prototyping-core", version = "0.5.0" }
gpui-table-runtime = { default-features = false, path = "crates/gpui-table-runtime", version = "0.5.0" }
gpui-table-schema = { path = "crates/gpui-table-schema", version = "0.5.0" }
gpui_platform = { branch = "linux-headless-renderer", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
], git = "https://github.com/stayhydated/zed" }
heck = "0.5.0"
icu = "2.2"
insta = "1.48"
inventory = "0.3"
itertools = "0.14"
jiff = "0.2"
koruma = { git = "https://github.com/stayhydated/koruma" }
koruma-collection = { git = "https://github.com/stayhydated/koruma" }
koruma-derive-core = { git = "https://github.com/stayhydated/koruma" }
log = "0.4"
prettyplease = "0.2"
proc-macro-crate = "3.5"
proc-macro2 = "1.0"
quote = "1.0"
regex = "1.13"
reqwest = "0.13"
reqwest_client = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed" }
rmcp = "2.2.0"
rust_decimal = "1.42"
serde = "1.0"
serde_json = "1.0"
spacetimedb-lib = "2.6"
strum = "0.28"
syn = "2.0"
thiserror = "2.0"
tokio = "1.53"
tracing-subscriber = "0.3"
trybuild = "1.0"
unicode-segmentation = "1.13"
urlencoding = "2.1"
uuid = "1.24"

[patch."https://github.com/zed-industries/zed"]
gpui = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "=0.2.2" }
gpui_macros = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "0.1.0" }

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
