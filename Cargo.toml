[workspace]
default-members = [ "examples/some-lib-tables" ]
members = [
  "crates/gpui-table",
  "crates/gpui-table-component",
  "crates/gpui-table-core",
  "crates/gpui-table-derive",
  "crates/gpui-table-mcp",
  "crates/gpui-table-prototyping-core",
  "crates/gpui-table-runtime",
  "crates/gpui-table-schema",
  "examples/mcp-query",
  "examples/prototyping",
  "examples/some-lib",
  "examples/some-lib-tables",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/stayhydated/gpui-table"
rust-version = "1.99"
version = "0.8.1"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = "4.6.7"
component-shape = "0.3.5"
component-shape-codegen = "0.3.5"
component-shape-mcp = "0.3.5"
console_error_panic_hook = "0.1.7"
criterion = { default-features = false, features = [ "cargo_bench_support" ], version = "0.8.2" }
darling = "0.24.1"
derive_more = "2.1.1"
dioxus = { default-features = false, version = "0.7.10" }
env_logger = "0.11.11"
es-fluent = "0.21.1"
es-fluent-build = "0.21.1"
es-fluent-lang = "0.21.1"
es-fluent-manager-embedded = "0.21.1"
fake = "5.1.0"
gpui-es-fluent = "0.3.1"
gpui-kit = "0.8.0"
gpui-storybook = "0.7.2"
gpui-table = { path = "crates/gpui-table", version = "0.8.1" }
gpui-table-component = { default-features = false, path = "crates/gpui-table-component", version = "0.8.1" }
gpui-table-core = { default-features = false, path = "crates/gpui-table-core", version = "0.8.1" }
gpui-table-derive = { path = "crates/gpui-table-derive", version = "0.8.1" }
gpui-table-mcp = { default-features = false, path = "crates/gpui-table-mcp", version = "0.8.1" }
gpui-table-prototyping-core = { path = "crates/gpui-table-prototyping-core", version = "0.8.1" }
gpui-table-runtime = { default-features = false, path = "crates/gpui-table-runtime", version = "0.8.1" }
gpui-table-schema = { path = "crates/gpui-table-schema", version = "0.8.1" }
heck = "0.5.0"
icu = "2.4.0"
insta = "1.49.0"
inventory = "0.3.25"
itertools = "0.15.0"
jiff = "0.2.38"
koruma = "0.13.1"
koruma-collection = "0.13.1"
koruma-derive-core = "0.13.1"
log = "0.4.34"
prettyplease = "0.3.0"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
proptest = { default-features = false, features = [ "std" ], version = "1.12.0" }
quote = "1.0.47"
regex = "1.13.1"
reqwest = "0.13.5"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.9" }
rmcp = "3.7.0"
rust_decimal = "1.43.0"
serde = "1.0.229"
serde_json = "1.0.154"
spacetimedb-lib = "2.13.0"
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "b3f91071b4e61702a63f57844560f70bbc9bf623" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "b3f91071b4e61702a63f57844560f70bbc9bf623" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "b3f91071b4e61702a63f57844560f70bbc9bf623" }
strum = "0.28.0"
syn = "3.0.9"
thiserror = "2.0.21"
tokio = "1.54.1"
tracing-subscriber = "0.3.23"
trybuild = "1.0.122"
unicode-segmentation = "1.13.3"
urlencoding = "2.1.3"
uuid = "1.29.0"
wasm-bindgen = "0.2.129"
web = { path = "web" }
web-sys = { features = [ "Location", "Window" ], version = "0.3.106" }

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
